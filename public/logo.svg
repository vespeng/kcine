<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="KCine">
  <defs>
    <style>
      /* 亮色主题：黑色播放三角 */
      .play-triangle {
        fill: #000000;
        stroke: #000000;
      }
      /* 暗色主题：白色播放三角 */
      @media (prefers-color-scheme: dark) {
        .play-triangle {
          fill: #ffffff;
          stroke: #ffffff;
        }
      }
    </style>
    <linearGradient id="topBand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7cc6ff"/>
      <stop offset="100%" stop-color="#1a86f2"/>
    </linearGradient>
    <linearGradient id="bottomBand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a86f2"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>
    <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#004d99"/>
    </linearGradient>
  </defs>

  <!-- 上半丝带（Bing 折带风格，亮色层） -->
  <path d="M 66.3 201.5 A 96 96 0 1 1 189.7 201.5"
        fill="none" stroke="url(#topBand)" stroke-width="36" stroke-linecap="round"/>
  <!-- 下半丝带（深色层，覆盖两端形成折痕） -->
  <path d="M 189.7 201.5 A 96 96 0 0 1 66.3 201.5"
        fill="none" stroke="url(#bottomBand)" stroke-width="36" stroke-linecap="round"/>
  <!-- 朝右的圆角播放三角 -->
  <path class="play-triangle" d="M 98 86 L 180 128 L 98 170 Z"
        stroke-width="12" stroke-linejoin="round"/>
</svg>
